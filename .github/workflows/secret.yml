# Scans the commits a pull request or a push to main adds for leaked credentials with TruffleHog.
# A finding verified as live, or one whose verification failed with an error, fails the job.
# Locally, pre-commit's gitleaks hook covers staged changes; job map:
# .agents/knowledge/github/checks.md.
name: Secret Scanning

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown
