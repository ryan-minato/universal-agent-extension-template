# Documentation site (https://zensical.org/docs/). Built by `just docs-check`; deployed to GitHub Pages
# by .github/workflows/docs.yml. The docs describe what is delivered and how to install it; the
# specifications under openspec/ stay the source of behavior, never copied here.
[project]
site_name = "universal-agent-extension-template"
site_url = "https://ryan-minato.github.io/universal-agent-extension-template/"
site_description = "A template for coding-agent plugins that install into Codex, Claude Code, Antigravity, and Pi from one repository."
repo_url = "https://github.com/ryan-minato/universal-agent-extension-template"
repo_name = "ryan-minato/universal-agent-extension-template"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Installation" = [
    { "Codex" = "installation/codex.md" },
    { "Claude Code" = "installation/claude-code.md" },
    { "Antigravity" = "installation/antigravity.md" },
    { "Pi" = "installation/pi.md" },
  ] },
  { "Guides" = [
    { "Adopting the template" = "guides/adopting-the-template.md" },
    { "Customizing a plugin" = "guides/customizing.md" },
    { "Verification items" = "guides/verification-items.md" },
  ] },
  { "Reference" = [
    { "Repository layout" = "reference/layout.md" },
    { "Generation" = "reference/generation.md" },
    { "Support matrix" = "reference/support-matrix.md" },
  ] },
  { "Compatibility" = [
    { "OpenCode" = "compatibility/opencode.md" },
  ] },
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
